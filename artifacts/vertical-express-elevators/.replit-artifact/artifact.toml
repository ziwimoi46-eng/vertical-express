kind = "web"
previewPath = "/"
title = "Vertical Express Elevators"
description = "A premium four-page corporate website for Vertical Express Elevators Pvt. Ltd., presenting the company, elevator services, real supplied photography, and contact information with responsive navigation and restrained motion."
version = "1.0.0"
id = "artifacts/vertical-express-elevators"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20937

[services.development]
run = "pnpm --filter @workspace/vertical-express-elevators run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/vertical-express-elevators", "run", "build" ]
serve = "static"
publicDir = "artifacts/vertical-express-elevators/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20937"
BASE_PATH = "/"
